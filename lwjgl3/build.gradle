buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath "io.github.fourlastor:construo:2.2.2"
        if (enableGraalNative == 'true') {
            classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:0.9.28"
        }
    }
}

plugins {
    id "application"
}

apply plugin: "io.github.fourlastor.construo"

import io.github.fourlastor.construo.Target

// Assets are read directly from workingDir (`assets/`) during `:lwjgl3:run` and packaged only in `jar`.
// Keeping `assets/` out of `sourceSets.main.resources` avoids copying ~39 MB on every `:lwjgl3:classes` build.

application {
    mainClass = "com.dungeonbound.game.lwjgl3.Lwjgl3Launcher"
    applicationName = appName
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    if (JavaVersion.current().isJava9Compatible()) {
        compileJava.options.release.set(17)
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"

    if (enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-backend-lwjgl3:$graalHelperVersion"
        implementation "io.github.berstanio:gdx-svmhelper-extension-freetype:$graalHelperVersion"
    }
    constraints {
        implementation "org.lwjgl:lwjgl:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-jemalloc:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-stb:$lwjgl3Version"
    }
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)

run {
    workingDir = rootProject.file('assets').path
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
    jvmArgs += "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"
    if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}

jar {
    archiveFileName.set("${appName}-${projectVersion}.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootProject.file('assets')) {
        exclude 'enemies/*/**'
        exclude 'ui/anim/wakwak/**', 'ui/anim/fireflies/**', 'ui/anim/torch/**', 'ui/anim/moonhalo/**'
    }
    exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Enable-Native-Access': 'ALL-UNNAMED',
            'Multi-Release': 'true',
            'Add-Exports': 'java.base/jdk.internal.misc'
        )
    }
    doLast {
        file(archiveFile).setExecutable(true, false)
    }
}

// -------------------------------------------------
// Texture atlas packing tasks (libGDX TexturePacker)
// -------------------------------------------------

// UI animation atlases
task packWakwak(type: JavaExec) {
    description = "Pack wakwak animation atlas"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.badlogic.gdx.tools.texturepacker.TexturePacker")
    args = ["${rootProject.rootDir}/assets/ui/anim/wakwak", "${rootProject.rootDir}/assets/ui/anim", "packed_wakwak"]
}

task packFireflies(type: JavaExec) {
    description = "Pack fireflies animation atlas"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.badlogic.gdx.tools.texturepacker.TexturePacker")
    args = ["${rootProject.rootDir}/assets/ui/anim/fireflies", "${rootProject.rootDir}/assets/ui/anim", "packed_fireflies"]
}

task packTorch(type: JavaExec) {
    description = "Pack torch animation atlas"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.badlogic.gdx.tools.texturepacker.TexturePacker")
    args = ["${rootProject.rootDir}/assets/ui/anim/torch", "${rootProject.rootDir}/assets/ui/anim", "packed_torch"]
}

task packMoonhalo(type: JavaExec) {
    description = "Pack moonhalo animation atlas"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.badlogic.gdx.tools.texturepacker.TexturePacker")
    args = ["${rootProject.rootDir}/assets/ui/anim/moonhalo", "${rootProject.rootDir}/assets/ui/anim", "packed_moonhalo"]
}

// Master task for all atlases (UI animations)
task packAllAtlases {
    description = "Run all texture packing tasks (UI animations)"
    dependsOn packWakwak, packTorch, packMoonhalo
}

tasks.register("jarMac") {
    dependsOn "jar"
    group "build"
    jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
    jar.exclude(
        "windows/**", "linux/**", "**/*.dll", "**/*.so", "**/*.dylib",
        'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    )
}

tasks.register("jarLinux") {
    dependsOn "jar"
    group "build"
    jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
    jar.exclude(
        "windows/**", "macos/**", "**/*.dll", "**/*.dylib", "**/*.so",
        'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    )
}

tasks.register("jarWin") {
    dependsOn "jar"
    group "build"
    jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
    jar.exclude(
        "macos/**", "linux/**", "**/*.dylib", "**/*.so",
        'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    )
}

// Construo configuration
construo {
    name.set(appName)
    humanName.set(appName)
    jlink {
        guessModulesFromJar.set(false)
        modules.addAll("java.base", "java.management", "java.desktop", "jdk.unsupported")
    }
    targets.configure {
        register("linuxX64", Target.Linux) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_linux_hotspot_21.0.10_7.tar.gz")
        }
        register("macM1", Target.MacOs) {
            architecture.set(Target.Architecture.AARCH64)
            jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.10_7.tar.gz")
            identifier.set("com.dungeonbound.game.${appName}")
            macIcon.set(project.file("icons/logo.icns"))
        }
        register("macX64", Target.MacOs) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_mac_hotspot_21.0.10_7.tar.gz")
            identifier.set("com.dungeonbound.game.${appName}")
            macIcon.set(project.file("icons/logo.icns"))
        }
        register("winX64", Target.Windows) {
            architecture.set(Target.Architecture.X86_64)
            icon.set(project.file("icons/logo.png"))
            jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_windows_hotspot_21.0.10_7.zip")
        }
    }
}

tasks.register("dist") {
    dependsOn "jar"
}

distributions {
    main {
        contents {
            into("libs") {
                project.configurations.runtimeClasspath.files.each { file ->
                    if (file.name != project.tasks.jar.outputs.files.singleFile.name) {
                        exclude file.name
                    }
                }
            }
        }
    }
}

startScripts.dependsOn(":lwjgl3:jar")
startScripts.classpath = project.tasks.jar.outputs.files

tasks.withType(JavaExec).configureEach {
    environment("__GL_THREADED_OPTIMIZATIONS", 0)
}

if (enableGraalNative == 'true') {
    apply from: file("nativeimage.gradle")
}
